<!DOCTYPE html>
<html>
<head>

<title>
Daftar Akun
</title>

<style>

body{
    background:#fff3d6;
    font-family:Arial;
}


.container{

    width:400px;
    margin:80px auto;
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px #ddd;

}


h2{

    text-align:center;
    color:#ff9800;

}


button{

    width:100%;
    padding:12px;
    border:none;
    border-radius:20px;
    background:#ff9800;
    color:white;
    font-size:16px;

}


input{

    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;

}
.password-box{

position:relative;
width:100%;

}



.password-box input{

width:100% !important ;
padding:0 45px 0 15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;

}

.password-box input:focus{

    border-color:#ff9800;

}

.eye{

position:absolute;

right:15px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

font-size:20px;
 z-index:2;
}

</style>

</head>


<body>


<div class="container">


<h2>
🎵 Daftar Summer Pop Festival
</h2>


<form method="POST">

{% csrf_token %}


<label>
Nama Lengkap
</label>

{{ form.nama }}


<br>


<label>
Nomor HP
</label>

{{ form.no_hp }}


<br>


<label>
Email
</label>

{{ form.email }}


<br>


<label>
Password
</label>


<div class="password-box">


{{ form.password }}


<span onclick="showPassword()" class="eye">
👁
</span>


</div>



<button type="submit">
Daftar Sekarang
</button>


</form>


</div>

<script>

function showPassword(){

    let password =
    document.querySelector(
        "#id_password"
    );


    if(password.type === "password"){

        password.type="text";

    }

    else{

        password.type="password";

    }

}

</script>

    );

        password.type="text";

    }

    }

}

</script>
</body>
</html>
